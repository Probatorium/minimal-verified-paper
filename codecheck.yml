---
version: https://codecheck.org.uk/spec/config/1.0/

manifest:
  - file: codecheck/report.txt
    comment: >
      Transcript of `python verify.py`. Every frozen figure in the manuscript is
      compared against a fresh computation and each comparison is reported by
      name. verify.py itself writes nothing, which is design property 6 of this
      package; this transcript is captured by codecheck_run.py, which runs
      verify.py as a subprocess. See the docstring of codecheck_run.py for why
      the property was not relaxed instead.
  - file: figures/digit_frequencies.svg
    comment: >
      The figure, regenerated by make_figure.py from the same computation the
      manuscript reports. It is SVG, so a difference is readable in a text diff
      rather than requiring an image comparison.

paper:
  title: >
    Uniformity of the First 1000 Decimal Digits of pi: A Minimal Stasis Artifact
  authors:
    - name: Alexis Garcia Hurtado
  reference: https://github.com/Probatorium/minimal-verified-paper

codechecker:
  - name:

summary: >
  One command, standard library only, no network, runs in seconds. `python
  codecheck_run.py` verifies every number printed in the two-page manuscript
  against a fresh computation over the first 1000 decimal digits of pi, computed
  in the repository rather than downloaded. The apparatus includes a mutation
  script that reports how many checks die under each mutant, so a codechecker can
  also confirm that the checks are load-bearing rather than decorative.

repository: https://github.com/Probatorium/minimal-verified-paper
